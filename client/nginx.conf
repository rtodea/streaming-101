server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: client-side routes (/catalog, /player/:id, /presenter)
    location / {
        try_files $uri /index.html;
    }

    # Hashed Vite assets are immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
