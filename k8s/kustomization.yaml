apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifests.yaml
# Argo CD Image Updater (configured via annotations on the Application in
# tadeo-microcosmos:apps/apps/streaming-101.yaml) updates `newTag:` below
# whenever a new SHA-tagged image lands in registry.tadeo.ro.
images:
  - name: registry.tadeo.ro/streaming-101-client
    newName: registry.tadeo.ro/streaming-101-client
    newTag: 17dc704
  - name: registry.tadeo.ro/streaming-101-server
    newName: registry.tadeo.ro/streaming-101-server
    newTag: 17dc704
